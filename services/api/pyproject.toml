[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanooni-karhvahi-api"
version = "0.1.0"
description = "FastAPI backend for Kanooni Karhvahi - Multilingual Legal Document Companion"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kanooni Karhvahi Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.6.0",
]
db = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9; python_version < '3.13'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
